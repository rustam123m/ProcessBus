# Qotom Intel Atom C3808 test scenarios (loopback cable between two NICs)
#
# name | gen_args | proc_args | gen_lcores | proc_lcores | duration_s | max_latency_us
# gen_lcores empty => generator -l 1 (single TX queue). Set it (e.g. 1,2 or
# 1,2,3,4,5) to exercise multi-queue R TX. proc_lcores empty/2 => single RX core
# (no sRSS); 1,2,3 => sRSS main+2; 1,2,3,4,5 => main+4 (worker count power of 2).
#
# Only the scenarios behind docs/R-messages_Linkedin_post.md are kept here.
# The two groups need DIFFERENT builds: run the Mbed TLS group against an
# mbedtls build and the OpenSSL group against an openssl build, or the crypto
# rows measure the wrong library. L2 and none touch no crypto and are in the
# Mbed TLS group only, to avoid duplicating them.

# ======================= Mbed TLS build =======================
# GOOSE-64, one RX core, 1 kHz per IED.
# Burst boundaries, one RX core: largest burst absorbed, then the first lost.
# The upper row of each pair is EXPECTED to be LIMIT - that is the measurement.
li_bb_burst_l2_12288   | --goose 32,384 --goose-entries 64 --burst | --goose 32 --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_l2_16384   | --goose 32,512 --goose-entries 64 --burst | --goose 32 --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_none_14336 | --rgoose 32,448 --r-mode none --goose-entries 64 --burst | --rgoose 32 --r-mode none --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_none_16384 | --rgoose 32,512 --r-mode none --goose-entries 64 --burst | --rgoose 32 --r-mode none --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_gcm_8192   | --rgoose 32,256 --r-mode gcm --goose-entries 64 --burst | --rgoose 32 --r-mode gcm --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_gcm_10240  | --rgoose 32,320 --r-mode gcm --goose-entries 64 --burst | --rgoose 32 --r-mode gcm --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_gcm_12288  | --rgoose 32,384 --r-mode gcm --goose-entries 64 --burst | --rgoose 32 --r-mode gcm --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_hmac_8192  | --rgoose 32,256 --r-mode hmac --goose-entries 64 --burst | --rgoose 32 --r-mode hmac --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_hmac_10240 | --rgoose 32,320 --r-mode hmac --goose-entries 64 --burst | --rgoose 32 --r-mode hmac --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
li_bb_burst_hmac_12288 | --rgoose 32,384 --r-mode hmac --goose-entries 64 --burst | --rgoose 32 --r-mode hmac --goose-entries 64 | 1,2,3,4,5 | 7 | 60 | 5000
