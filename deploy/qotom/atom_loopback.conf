# Qotom Intel Atom C3808 test scenarios (loopback cable between two NICs)
#
# name | gen_args | proc_args | gen_lcores | proc_lcores | duration_s | max_latency_us
# gen_lcores empty => generator -l 1 (single TX queue). Set it (e.g. 1,2 or
# 1,2,3,4,5) to exercise multi-queue R TX. proc_lcores empty/2 => single RX core
# (no sRSS); 1,2,3 => sRSS main+2; 1,2,3,4,5 => main+4 (worker count power of 2).
#
# Only the scenarios behind docs/R-messages_Linkedin_post.md are kept here.
# The two groups need DIFFERENT builds: run the Mbed TLS group against an
# mbedtls build and the OpenSSL group against an openssl build, or the crypto
# rows measure the wrong library. L2 and none touch no crypto and are in the
# Mbed TLS group only, to avoid duplicating them.

