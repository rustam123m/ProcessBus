# Qotom Intel Atom C3808 test scenarios (loopback cable between two NICs)
#
# name              | gen_args           | proc_args    | proc_lcores | duration_s | max_latency_us
goose_100x10k       | --goose 100,10000  | --goose 100  |             | 300        | 100
goose_200x10k       | --goose 200,10000  | --goose 200  |             | 300        | 120
goose_300x10k_mc    | --goose 300,10000  | --goose 300  | 4,5,6       | 300        | 100
sv80_500            | --sv80 500         | --sv80 500   |             | 300        | 100
sv80_1000           | --sv80 1000        | --sv80 1000  |             | 600        | 150
sv256_100           | --sv256 100        | --sv256 100  |             | 300        | 100

# --- IEC 61850-90-5 routable, functional checks ----------------------------
# Low rate and short duration on purpose: these prove the routable envelope and
# its security work end to end, not throughput. --r-mode must match on both
# sides, so it appears twice per line. Compare rgoose_none against goose_100x10k
# for the envelope cost, and against rgoose_hmac / rgoose_gcm for the crypto.
rgoose_none         | --rgoose 10,100 --r-mode none | --rgoose 10 --r-mode none |  | 60  | 500
rgoose_hmac         | --rgoose 10,100 --r-mode hmac | --rgoose 10 --r-mode hmac |  | 60  | 500
rgoose_gcm          | --rgoose 10,100 --r-mode gcm  | --rgoose 10 --r-mode gcm  |  | 60  | 500
rsv80_r_none        | --rsv80 1 --r-mode none       | --rsv80 1 --r-mode none   |  | 60  | 500
rsv80_r_gcm         | --rsv80 1 --r-mode gcm        | --rsv80 1 --r-mode gcm    |  | 60  | 500

# Loaded R-GOOSE, one line per security mode. Same 100x10k rate as the L2
# goose_100x10k baseline above, so the four runs difference into: envelope
# (goose -> none), authentication (none -> hmac), encryption (none -> gcm).
# Frame sizes differ (248 / 266 / 278 B) so compare Load %, not Mbps.
rgoose_100x10k_none | --rgoose 100,10000 --r-mode none | --rgoose 100 --r-mode none |  | 120 | 500
rgoose_100x10k_hmac | --rgoose 100,10000 --r-mode hmac | --rgoose 100 --r-mode hmac |  | 120 | 500
rgoose_100x10k_gcm  | --rgoose 100,10000 --r-mode gcm  | --rgoose 100 --r-mode gcm  |  | 120 | 500

# Direct counterparts to docs/Results_in_nonRT.md, security none, 300 s to match
# that document's 5-minute runs. Same stream counts and rates, so R-GOOSE/R-SV
# load can be read against the L2 figures line for line. Core layout copied too:
# 100k/200k single core, 300k/350k on main+2 workers (RSS needs a power of two).
rgoose_100x10k_n5m  | --rgoose 100,10000 --r-mode none | --rgoose 100 --r-mode none |       | 300 | 500
rgoose_200x10k_n5m  | --rgoose 200,10000 --r-mode none | --rgoose 200 --r-mode none |       | 300 | 500
rgoose_300x10k_n5m  | --rgoose 300,10000 --r-mode none | --rgoose 300 --r-mode none | 4,5,6 | 300 | 500
rgoose_350x10k_n5m  | --rgoose 350,10000 --r-mode none | --rgoose 350 --r-mode none | 4,5,6 | 300 | 500
rsv80_1000_n5m      | --rsv80 1000 --r-mode none       | --rsv80 1000 --r-mode none |       | 300 | 500

# Same load points with software RSS on RX. The single-core rows above pin the
# receiver, so these separate "one core ran out" from "the design ran out".
# Worker count must be a power of two: 4,5,6 = main+2, 2,3,4,5,6 = main+4.
rgoose_200x10k_rss2 | --rgoose 200,10000 --r-mode none | --rgoose 200 --r-mode none | 4,5,6     | 300 | 500
rgoose_350x10k_rss4 | --rgoose 350,10000 --r-mode none | --rgoose 350 --r-mode none | 2,3,4,5,6 | 300 | 500
rsv80_1000_rss2     | --rsv80 1000 --r-mode none       | --rsv80 1000 --r-mode none | 4,5,6     | 300 | 500

# Ceiling hunt on main+4. Note the wire, not just the CPU: a 248 B R-GOOSE frame
# occupies 268 B with preamble and IFG, so 10 GbE tops out near 4.66 Mpps.
# 400k is ~86% of that, 450k ~97% — the second one is expected to run out of
# link before it runs out of cores.
rgoose_400x10k_rss4 | --rgoose 400,10000 --r-mode none | --rgoose 400 --r-mode none | 2,3,4,5,6 | 300 | 500
rgoose_450x10k_rss4 | --rgoose 450,10000 --r-mode none | --rgoose 450 --r-mode none | 2,3,4,5,6 | 300 | 500

# 64 dataset entries: ~392 B/frame vs 248 B at 16. Rates scanned around the
# ~2.5 Mpps the measured 8.4 Gb/s wire ceiling predicts for that frame size.
rgoose_e64_100x10k  | --rgoose 100,10000 --r-mode none --goose-entries 64 | --rgoose 100 --r-mode none --goose-entries 64 |           | 300 | 500
rgoose_e64_200x10k  | --rgoose 200,10000 --r-mode none --goose-entries 64 | --rgoose 200 --r-mode none --goose-entries 64 | 4,5,6     | 300 | 500
rgoose_e64_250x10k  | --rgoose 250,10000 --r-mode none --goose-entries 64 | --rgoose 250 --r-mode none --goose-entries 64 | 2,3,4,5,6 | 300 | 500
rgoose_e64_300x10k  | --rgoose 300,10000 --r-mode none --goose-entries 64 | --rgoose 300 --r-mode none --goose-entries 64 | 2,3,4,5,6 | 300 | 500

# 64 streams x 64 entries x 1000 changes/s = 64k pps. Light on purpose: every
# security mode can sustain it, so the three rows differ only in CPU load at an
# identical delivered rate. The 100x10k rows above cannot be read that way —
# there the generator saturated at a different rate in each mode.
rgoose_e64_64x1k_none | --rgoose 64,1000 --r-mode none --goose-entries 64 | --rgoose 64 --r-mode none --goose-entries 64 |  | 300 | 500
rgoose_e64_64x1k_hmac | --rgoose 64,1000 --r-mode hmac --goose-entries 64 | --rgoose 64 --r-mode hmac --goose-entries 64 |  | 300 | 500
rgoose_e64_64x1k_gcm  | --rgoose 64,1000 --r-mode gcm  --goose-entries 64 | --rgoose 64 --r-mode gcm  --goose-entries 64 |  | 300 | 500

# 416 dataset entries: 1399 B L2 GOOSE, 1452 B R-GOOSE none (+18 hmac, +30 gcm)
# — the largest that still fit one 1500 B MTU. 10 GbE tops out near 849 kpps at
# that size, so rates are ~4x below the 248 B ladder at ~26x the parse cost.
goose_e416_100x1k       | --goose 100,1000 --goose-entries 416 | --goose 100 --goose-entries 416 |           | 300 | 500
goose_e416_100x8k_rss4  | --goose 100,8000 --goose-entries 416 | --goose 100 --goose-entries 416 | 2,3,4,5,6 | 300 | 500
rgoose_e416_100x1k_none | --rgoose 100,1000 --r-mode none --goose-entries 416 | --rgoose 100 --r-mode none --goose-entries 416 |           | 300 | 500
rgoose_e416_100x1k_hmac | --rgoose 100,1000 --r-mode hmac --goose-entries 416 | --rgoose 100 --r-mode hmac --goose-entries 416 |           | 300 | 500
rgoose_e416_100x1k_gcm  | --rgoose 100,1000 --r-mode gcm  --goose-entries 416 | --rgoose 100 --r-mode gcm  --goose-entries 416 |           | 300 | 500
rgoose_e416_200x1k      | --rgoose 200,1000 --r-mode none --goose-entries 416 | --rgoose 200 --r-mode none --goose-entries 416 |           | 300 | 500
rgoose_e416_100x4k      | --rgoose 100,4000 --r-mode none --goose-entries 416 | --rgoose 100 --r-mode none --goose-entries 416 | 4,5,6     | 300 | 500
rgoose_e416_100x8k_rss4 | --rgoose 100,8000 --r-mode none --goose-entries 416 | --rgoose 100 --r-mode none --goose-entries 416 | 2,3,4,5,6 | 300 | 500
