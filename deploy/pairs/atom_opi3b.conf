# Cross-device scenarios. Cable: blackbox 0000:07:00.0 <-> opi3b 0000:01:00.0.
# Link runs at the slower NIC's speed: interop and CPU, not throughput.
#
# name | gen_host | gen_args | proc_host | proc_args | gen_lcores | proc_lcores | duration_s | max_latency_us
# gen_lcores empty => generator -l 1 (single TX queue); set it (1,2 / 1,2,3) for
# multi-queue R TX. proc_lcores empty/2 => single RX core; 1,2,3 => sRSS main+2.
# The OrangePi keeps core 0 free, so its single RX core is lcore 2.
#
# Only the scenarios behind docs/R-messages_Linkedin_post.md are kept here.
# The two groups need DIFFERENT builds on BOTH devices: run the Mbed TLS group
# against mbedtls builds and the OpenSSL group against openssl builds. L2 and
# none touch no crypto and are in the Mbed TLS group only.

