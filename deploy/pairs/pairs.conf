b2o_sv80_func         | blackbox | --sv80 10                     | opi3b    | --sv80 10                 |  1,2,3 | 60 | 0
o2b_goose_func        | opi3b    | --goose 10,100                | blackbox | --goose 10                |        | 60 | 0
o2b_rgoose_func       | opi3b    | --rgoose 10,100 --r-mode none | blackbox | --rgoose 10 --r-mode none |        | 60 | 0
o2b_sv80_func         | opi3b    | --sv80 10                     | blackbox | --sv80 10                 |        | 60 | 0

